<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mymem · AI 记忆中心</title>
<style>
  :root {
    --bg: #f6f1e9; --card: #ffffff; --ink: #1c1b19; --muted: #8a8378;
    --line: #e8e1d5; --accent: #1f6f6b; --accent-deep: #17443f;
    --decision: #3b3fa8; --lesson: #d98a2b; --convention: #2e8b57;
    --context: #46586a; --archive: #9a8c7a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; min-height: 100vh;
  }

  /* ===== 左侧栏 ===== */
  .sidebar {
    width: 300px; flex-shrink: 0; padding: 36px 28px;
    border-right: 1px solid var(--line);
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  .brand { font-size: 34px; font-weight: 800; letter-spacing: -.5px; }
  .brand-sub {
    color: var(--muted); font-size: 13px; letter-spacing: 2px;
    text-transform: uppercase; margin: 2px 0 26px;
  }
  .side-label {
    font-size: 12px; font-weight: 700; letter-spacing: 1.5px;
    text-transform: uppercase; color: var(--muted);
    margin: 22px 0 10px;
  }
  .sidebar input {
    width: 100%; font: inherit; padding: 11px 16px;
    border: 1.5px solid var(--line); border-radius: 999px;
    background: #fff; color: var(--ink); outline: none;
  }
  .sidebar input:focus { border-color: var(--accent); }
  .search-wrap { position: relative; }
  .search-wrap input { padding-left: 40px; }
  .search-wrap::before {
    content: "⌕"; position: absolute; left: 16px; top: 50%;
    transform: translateY(-52%); color: var(--muted); font-size: 17px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 7px 15px; border-radius: 999px; cursor: pointer;
    border: 1.5px solid var(--line); background: #fff;
    font-size: 13px; font-weight: 600; color: var(--ink);
    user-select: none;
  }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; }
  .chip.active { background: var(--ink); border-color: var(--ink); color: #fff; }
  #reload {
    width: 100%; margin-top: 28px; padding: 13px;
    border: 0; border-radius: 999px; background: var(--ink); color: #fff;
    font: inherit; font-weight: 700; letter-spacing: 2px; cursor: pointer;
  }
  #reload:hover { background: var(--accent); }

  /* ===== 主区 ===== */
  main { flex: 1; padding: 36px 44px 80px; max-width: 1100px; }
  .stats {
    display: flex; flex-wrap: wrap; gap: 56px;
    padding-bottom: 30px; border-bottom: 1.5px solid var(--line);
    margin-bottom: 34px;
  }
  .stat .num { font-size: 42px; font-weight: 800; line-height: 1.15; }
  .stat .label {
    font-size: 11px; font-weight: 700; letter-spacing: 2px;
    text-transform: uppercase; color: var(--muted);
  }
  h2 {
    font-size: 13px; font-weight: 700; letter-spacing: 2.5px;
    text-transform: uppercase; color: var(--muted);
    margin: 38px 0 18px;
  }

  /* agent 卡片 */
  .agent-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 22px;
  }
  .agent-card {
    background: var(--card); border-radius: 18px; padding: 24px;
    box-shadow: 0 1px 3px rgba(28, 27, 25, .05);
  }
  .agent-head { display: flex; align-items: flex-start; gap: 12px; }
  .agent-name {
    font-size: 15px; font-weight: 800; letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .agent-sys { font-size: 11px; letter-spacing: 1px; color: var(--muted); }
  .count-badge {
    margin-left: auto; flex-shrink: 0;
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--accent-deep); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700;
  }
  .mem { border-top: 1px solid var(--line); padding: 13px 0 3px; margin-top: 12px; }
  .mem .row { display: flex; align-items: baseline; gap: 10px; }
  .pill {
    flex-shrink: 0; padding: 2px 11px; border-radius: 999px;
    font-size: 11px; font-weight: 700; color: #fff; letter-spacing: .5px;
  }
  .p-decision { background: var(--decision); }
  .p-lesson { background: var(--lesson); }
  .p-convention { background: var(--convention); }
  .p-context { background: var(--context); }
  .p-archive { background: var(--archive); }
  .mem .title { font-weight: 600; font-size: 14px; }
  .mem .content {
    color: var(--muted); font-size: 13px; white-space: pre-wrap;
    margin: 5px 0 0;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* 时间线卡片 */
  .tl {
    background: var(--card); border-radius: 14px; padding: 20px 26px;
    margin-bottom: 16px; display: flex; gap: 20px;
    border-left: 8px solid var(--line);
    box-shadow: 0 1px 3px rgba(28, 27, 25, .05);
    cursor: pointer;
  }
  .tl.tl-decision { border-left-color: var(--decision); }
  .tl.tl-lesson { border-left-color: var(--lesson); }
  .tl.tl-convention { border-left-color: var(--convention); }
  .tl.tl-context { border-left-color: var(--context); }
  .tl.tl-archive { border-left-color: var(--archive); }
  .tl .body { flex: 1; min-width: 0; }
  .tl .title { font-size: 18px; font-weight: 700; line-height: 1.35; }
  .tl .content {
    color: var(--muted); margin: 6px 0 0; white-space: pre-wrap;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .tl.open .content { display: block; -webkit-line-clamp: unset; }
  .tl .meta {
    font-size: 12px; color: var(--muted); margin-top: 10px;
    display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center;
  }
  .tl .meta .time { font-weight: 600; color: var(--ink); }
  .archived-mark {
    font-size: 11px; color: var(--archive); border: 1px solid var(--archive);
    border-radius: 999px; padding: 0 8px;
  }

  .empty {
    background: var(--card); border-radius: 18px; padding: 60px;
    text-align: center; color: var(--muted); font-size: 15px;
  }
  #error {
    display: none; background: #fdeaea; color: #b3261e;
    border-radius: 12px; padding: 12px 18px; margin-bottom: 20px;
  }

  @media (max-width: 860px) {
    body { flex-direction: column; }
    .sidebar { width: 100%; height: auto; position: static; border-right: 0; border-bottom: 1px solid var(--line); }
    main { padding: 24px 20px 60px; }
    .stats { gap: 28px; }
    .stat .num { font-size: 32px; }
  }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="brand">mymem</div>
  <div class="brand-sub">AI 记忆中心</div>

  <div class="search-wrap">
    <input type="text" id="q" placeholder="搜索记忆…">
  </div>

  <div class="side-label">日期</div>
  <input type="date" id="date">

  <div class="side-label">项目</div>
  <input type="text" id="project" placeholder="全部项目">

  <div class="side-label">类别</div>
  <div class="chips" id="catChips"></div>

  <div class="side-label">访问令牌</div>
  <input type="password" id="token" placeholder="可选">

  <button id="reload">查 询</button>
</aside>

<main>
  <div id="error"></div>
  <div class="stats" id="stats"></div>

  <h2>各 Agent 今日工作</h2>
  <div class="agent-grid" id="agents"></div>

  <h2>时间线</h2>
  <div id="timeline"></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const CATEGORIES = ["decision", "lesson", "convention", "context", "archive"];
const CAT_CN = { decision: "决策", lesson: "教训", convention: "约定",
                 context: "上下文", archive: "归档" };
const CAT_VAR = { decision: "#3b3fa8", lesson: "#d98a2b", convention: "#2e8b57",
                  context: "#46586a", archive: "#9a8c7a" };

{
  const now = new Date();
  const p = (n) => String(n).padStart(2, "0");
  $("date").value = `${now.getFullYear()}-${p(now.getMonth() + 1)}-${p(now.getDate())}`;
}
$("token").value = localStorage.getItem("mymem_token") || "";

// 类别筛选 chips（单选，可取消）
let activeCat = null;
{
  const mk = (c) => `<div class="chip" data-cat="${c}">
      <span class="dot" style="background:${CAT_VAR[c]}"></span>${CAT_CN[c]}</div>`;
  $("catChips").innerHTML = CATEGORIES.map(mk).join("");
  $("catChips").addEventListener("click", (e) => {
    const chip = e.target.closest(".chip");
    if (!chip) return;
    const cat = chip.dataset.cat;
    activeCat = (activeCat === cat) ? null : cat;
    document.querySelectorAll(".chip").forEach((el) =>
      el.classList.toggle("active", el.dataset.cat === activeCat));
    render(lastItems);
  });
}

function headers() {
  const t = $("token").value.trim();
  if (t) localStorage.setItem("mymem_token", t);
  return t ? { "Authorization": "Bearer " + t } : {};
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function esc(s) {
  return (s || "").replace(/[&<>"]/g,
    (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

let lastItems = [];

async function load() {
  $("error").style.display = "none";
  const date = $("date").value;
  const project = $("project").value.trim();
  const q = $("q").value.trim();
  const params = new URLSearchParams({ limit: 500, include_archived: "true" });
  if (q) {
    params.set("q", q);          // 搜索时跨日期全文检索
  } else if (date) {
    params.set("date", date);
  }
  if (project) params.set("project", project);
  try {
    const resp = await fetch("/api/v1/memories?" + params, { headers: headers() });
    if (!resp.ok) throw new Error("HTTP " + resp.status + " " + await resp.text());
    lastItems = await resp.json();
    render(lastItems);
  } catch (e) {
    $("error").textContent = "加载失败：" + e.message;
    $("error").style.display = "block";
  }
}

function render(all) {
  const items = activeCat ? all.filter((m) => m.category === activeCat) : all;

  // 大数字统计
  const byCat = {};
  const byAgent = {};
  for (const it of items) {
    byCat[it.category] = (byCat[it.category] || 0) + 1;
    const key = it.source_agent + " " + it.source_system;
    (byAgent[key] = byAgent[key] || []).push(it);
  }
  const stat = (n, label) =>
    `<div class="stat"><div class="num">${n}</div><div class="label">${label}</div></div>`;
  $("stats").innerHTML =
    stat(items.length, "记忆总数") +
    stat(Object.keys(byAgent).length, "参与 Agent") +
    CATEGORIES.filter((c) => byCat[c]).map((c) => stat(byCat[c], CAT_CN[c])).join("");
  // agent 卡片
  const agentHtml = Object.entries(byAgent).map(([key, list]) => {
    const i = key.indexOf(" ");
    const agent = key.slice(0, i), system = key.slice(i + 1);
    const mems = list.slice().sort((a, b) => b.created_at.localeCompare(a.created_at));
    return `<div class="agent-card">
      <div class="agent-head">
        <div>
          <div class="agent-name">${esc(agent)}</div>
          <div class="agent-sys">SYSTEM · ${esc(system || "未标识")}</div>
        </div>
        <div class="count-badge">${list.length}</div>
      </div>
      ${mems.map((m) => `
        <div class="mem">
          <div class="row">
            <span class="pill p-${m.category}">${CAT_CN[m.category]}</span>
            <span class="title">${esc(m.title)}</span>
          </div>
          <div class="content">${esc(m.content)}</div>
        </div>`).join("")}
    </div>`;
  }).join("");
  $("agents").innerHTML = agentHtml || `<div class="empty">当天没有记录</div>`;
  // 时间线卡片（点击展开全文）
  if (!items.length) {
    $("timeline").innerHTML = `<div class="empty">没有匹配的记忆</div>`;
    return;
  }
  $("timeline").innerHTML = items
    .slice()
    .sort((a, b) => b.created_at.localeCompare(a.created_at))
    .map((m) => `
      <div class="tl tl-${m.category}">
        <div class="body">
          <div class="title">${esc(m.title)}</div>
          <div class="content">${esc(m.content)}</div>
          <div class="meta">
            <span class="time">${fmtTime(m.created_at)}</span>
            <span class="pill p-${m.category}">${CAT_CN[m.category]}</span>
            <span>${esc(m.project)}</span>
            <span>${esc(m.source_agent)}</span>
            <span>${esc(m.source_system)}</span>
            ${m.archived ? '<span class="archived-mark">已归档</span>' : ""}
          </div>
        </div>
      </div>`).join("");
  document.querySelectorAll(".tl").forEach((el) =>
    el.addEventListener("click", () => el.classList.toggle("open")));
}

$("reload").addEventListener("click", load);
$("date").addEventListener("change", () => { $("q").value = ""; load(); });
$("q").addEventListener("keydown", (e) => { if (e.key === "Enter") load(); });
load();
</script>
</body>
</html>
